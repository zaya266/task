<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas – My Tasks</title>
    <style>
      :root {
        --bg: #f4f6fb;
        --card: #fff;
        --line: #e6e9f1;
        --text: #1b2236;
        --muted: #7a839a;
        --brand: #1f4fe0;
        --brand-soft: #e8eeff;
        --green: #18a56a;
        --green-bg: #e3f6ec;
        --red: #d6334f;
        --red-bg: #fde7ec;
        --blue: #2f6bff;
        --blue-bg: #e6eeff;
        --gray: #6b7488;
        --gray-bg: #eef0f5;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
        font-size: 13px;
      }
      .app {
        display: grid;
        grid-template-columns: 220px 1fr;
        min-height: 100vh;
      }
      .sidebar {
        background: var(--card);
        border-right: 1px solid var(--line);
        padding: 20px 14px;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 8px;
        font-weight: 700;
        font-size: 18px;
        margin-bottom: 24px;
      }
      .logo-mark {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        border: 4px solid var(--brand);
      }
      .nav-item {
        width: 100%;
        display: flex;
        justify-content: space-between;
        background: none;
        border: 0;
        padding: 10px;
        border-radius: 8px;
        font: inherit;
        color: var(--text);
        cursor: pointer;
      }
      .nav-item:hover {
        background: var(--bg);
      }
      .nav-item i {
        font-style: normal;
        color: var(--muted);
      }
      .sub {
        display: flex;
        justify-content: space-between;
        padding: 8px 10px 8px 24px;
        color: var(--muted);
        border-radius: 8px;
        cursor: pointer;
      }
      .sub.active {
        background: var(--brand-soft);
        color: var(--brand);
        font-weight: 600;
      }
      .sub b {
        background: var(--brand);
        color: #fff;
        border-radius: 6px;
        padding: 0 6px;
        font-size: 11px;
      }
      .topbar {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 14px 28px;
        background: var(--card);
        border-bottom: 1px solid var(--line);
      }
      .search {
        flex: 1;
        max-width: 340px;
        padding: 9px 12px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--bg);
        font: inherit;
      }
      .topbar .btn-outline {
        margin-left: auto;
      }
      .btn-outline {
        border: 1px solid var(--line);
        background: var(--card);
        padding: 8px 12px;
        border-radius: 8px;
        font: inherit;
        cursor: pointer;
      }
      .user {
        display: flex;
        gap: 10px;
        align-items: center;
      }
      .user small {
        display: block;
        color: var(--muted);
        font-size: 11px;
      }
      .avatar {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        background: var(--brand);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 600;
      }
      .content {
        padding: 24px 28px;
      }
      .title-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 26px;
        letter-spacing: -0.02em;
      }
      .btn-primary {
        background: var(--brand);
        color: #fff;
        border: 0;
        padding: 10px 16px;
        border-radius: 8px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      .btn-primary:hover {
        filter: brightness(1.1);
      }
      .filters {
        display: flex;
        gap: 8px;
        margin-bottom: 14px;
      }
      select {
        padding: 8px 10px;
        border: 1px solid var(--line);
        border-radius: 8px;
        background: var(--card);
        font: inherit;
      }
      .stats {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin-bottom: 16px;
      }
      .stat {
        display: flex;
        justify-content: space-between;
        align-items: center;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
        cursor: pointer;
        font: inherit;
        text-align: left;
      }
      .stat.on {
        border-color: var(--brand);
        box-shadow: 0 0 0 2px var(--brand-soft);
      }
      .stat b {
        font-size: 15px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 12px;
        overflow: hidden;
      }
      th {
        background: #f7f8fc;
        color: var(--muted);
        font-weight: 500;
        text-align: left;
        padding: 10px 14px;
        font-size: 12px;
      }
      td {
        padding: 14px;
        border-top: 1px solid var(--line);
      }
      td.title {
        font-weight: 500;
      }
      .proj {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .dot {
        width: 22px;
        height: 22px;
        border-radius: 50%;
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 11px;
        font-weight: 700;
      }
      .pill {
        display: inline-block;
        padding: 3px 10px;
        border-radius: 999px;
        font-size: 11px;
        font-weight: 500;
      }
      .s-Complete {
        background: var(--green-bg);
        color: var(--green);
      }
      .s-Overdue {
        background: var(--red-bg);
        color: var(--red);
      }
      .s-In-Progress {
        background: var(--blue-bg);
        color: var(--blue);
      }
      .s-To-Do {
        background: var(--gray-bg);
        color: var(--gray);
      }
      .pr {
        display: inline-block;
        padding: 2px 10px;
        border-radius: 999px;
        border: 1px solid var(--line);
        font-size: 11px;
      }
      .pr-High {
        border-color: var(--red);
        color: var(--red);
      }
      .pr-Medium {
        border-color: #e0a21c;
        color: #b27a00;
      }
      .pr-Low {
        border-color: var(--muted);
        color: var(--muted);
      }
      .footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 14px;
      }
      .pager {
        display: flex;
        gap: 6px;
      }
      .pager button {
        width: 30px;
        height: 30px;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--card);
        cursor: pointer;
        font: inherit;
      }
      .pager button.on {
        background: var(--brand);
        color: #fff;
        border-color: var(--brand);
      }
      .total {
        color: var(--muted);
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 28px;
      }
      button:focus-visible,
      input:focus-visible,
      select:focus-visible {
        outline: 2px solid var(--brand);
        outline-offset: 2px;
      }
      @media (max-width: 900px) {
        .app {
          grid-template-columns: 1fr;
        }
        .sidebar {
          display: none;
        }
        .stats {
          grid-template-columns: repeat(2, 1fr);
        }
        .content {
          overflow-x: auto;
        }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <aside class="sidebar">
        <div class="logo"><span class="logo-mark"></span>Atlas</div>
        <nav>
          <div class="nav-group open">
            <button class="nav-item">Dashboard <i>⌃</i></button>
            <a class="sub">Overview</a>
            <a class="sub active">My Tasks <b>6</b></a>
            <a class="sub">Activity</a>
          </div>
          <button class="nav-item">Projects <i>⌄</i></button>
          <button class="nav-item">Tasks <i>⌄</i></button>
          <button class="nav-item">Calendar <i>⌄</i></button>
          <button class="nav-item">Analytics <i>⌄</i></button>
          <button class="nav-item">Team <i>⌄</i></button>
          <button class="nav-item">Files <i>⌄</i></button>
          <button class="nav-item">Integrations <i>⌄</i></button>
          <button class="nav-item">Settings <i>⌄</i></button>
        </nav>
      </aside>

      <div class="main">
        <header class="topbar">
          <input
            id="search"
            class="search"
            type="search"
            placeholder="Search task / project"
          />
          <button class="btn-outline">Create New ▾</button>
          <div class="user">
            <span class="avatar">RA</span>
            <div>
              <strong>Revhan Adinata</strong><small>Lead Product</small>
            </div>
          </div>
        </header>

        <section class="content">
          <div class="title-row">
            <h1>My Tasks</h1>
            <button class="btn-primary">+ Create New Task</button>
          </div>

          <div class="filters">
            <select>
              <option>All Project</option>
            </select>
            <select>
              <option>All Time</option>
            </select>
            <select>
              <option>All Status</option>
            </select>
            <select>
              <option>All Priority</option>
            </select>
          </div>

          <div class="stats" id="stats"></div>

          <table>
            <thead>
              <tr>
                <th>Task Title</th>
                <th>Project</th>
                <th>Due Date</th>
                <th>Status</th>
                <th>Priority</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>

          <div class="footer">
            <div class="pager" id="pager"></div>
            <span class="total" id="total"></span>
          </div>
        </section>
      </div>
    </div>

    <script>
      const tasks = [
        [
          "Design System Audit",
          "Amazon Dashboard",
          "A",
          "#ff9900",
          "15 Jan 2026",
          "Complete",
          "High",
        ],
        [
          "Landing Page Copywriting",
          "Microsoft",
          "M",
          "#00a4ef",
          "12 Jan 2026",
          "Complete",
          "High",
        ],
        [
          "Mobile App Redesign",
          "Apple",
          "A",
          "#111",
          "14 Jan 2026",
          "Complete",
          "High",
        ],
        [
          "Key Metrics Layout",
          "Facebook Dashboard",
          "f",
          "#1877f2",
          "16 Jan 2026",
          "Overdue",
          "Low",
        ],
        [
          "Wireframe v3 Upload",
          "Netflix",
          "N",
          "#e50914",
          "17 Jan 2026",
          "In Progress",
          "Low",
        ],
        [
          "QA Testing",
          "Nvidia",
          "N",
          "#76b900",
          "17 Jan 2026",
          "In Progress",
          "Low",
        ],
        [
          "Prototype Review",
          "Behance",
          "Bē",
          "#1769ff",
          "18 Jan 2026",
          "In Progress",
          "Medium",
        ],
        [
          "Copywriting Review",
          "Google Dashboard",
          "G",
          "#ea4335",
          "24 Jan 2026",
          "To Do",
          "Medium",
        ],
        [
          "UX Audit",
          "Grab Map App",
          "g",
          "#00b14f",
          "25 Jan 2026",
          "To Do",
          "Medium",
        ],
        [
          "Review Landing Page",
          "Logo",
          "L",
          "#c0392b",
          "26 Jan 2026",
          "Complete",
          "Medium",
        ],
      ].map(([title, project, ic, color, due, status, priority]) => ({
        title,
        project,
        ic,
        color,
        due,
        status,
        priority,
      }));

      const state = { status: null, query: "", page: 1 };
      const PER_PAGE = 10;
      const $ = (id) => document.getElementById(id);
      const cls = (s) => s.replace(" ", "-");

      function filtered() {
        return tasks.filter(
          (t) =>
            (!state.status || t.status === state.status) &&
            (t.title + t.project).toLowerCase().includes(state.query),
        );
      }

      function renderStats() {
        const items = [
          ["To Do", "To Do"],
          ["In Progress", "In Progress"],
          ["Completed", "Complete"],
          ["Overdue", "Overdue"],
        ];
        $("stats").innerHTML = items
          .map(
            ([label, key]) =>
              `<button class="stat ${state.status === key ? "on" : ""}" data-key="${key}">${label}<b>${tasks.filter((t) => t.status === key).length}</b></button>`,
          )
          .join("");
      }

      function render() {
        const list = filtered();
        const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
        state.page = Math.min(state.page, pages);
        const slice = list.slice(
          (state.page - 1) * PER_PAGE,
          state.page * PER_PAGE,
        );

        $("rows").innerHTML = slice.length
          ? slice
              .map(
                (t) => `
    <tr>
      <td class="title">${t.title}</td>
      <td><span class="proj"><span class="dot" style="background:${t.color}">${t.ic}</span>${t.project}</span></td>
      <td>${t.due}</td>
      <td><span class="pill s-${cls(t.status)}">${t.status}</span></td>
      <td><span class="pr pr-${t.priority}">${t.priority}</span></td>
      <td>⋮</td>
    </tr>`,
              )
              .join("")
          : `<tr><td colspan="6" class="empty">No tasks match. Clear the filter or search.</td></tr>`;

        $("pager").innerHTML = Array.from(
          { length: pages },
          (_, i) =>
            `<button class="${i + 1 === state.page ? "on" : ""}" data-p="${i + 1}">${i + 1}</button>`,
        ).join("");
        $("total").textContent = `Total ${list.length} Data`;
        renderStats();
      }

      $("stats").addEventListener("click", (e) => {
        const b = e.target.closest(".stat");
        if (!b) return;
        state.status = state.status === b.dataset.key ? null : b.dataset.key;
        state.page = 1;
        render();
      });
      $("pager").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        state.page = +b.dataset.p;
        render();
      });
      $("search").addEventListener("input", (e) => {
        state.query = e.target.value.toLowerCase();
        state.page = 1;
        render();
      });

      render();
    </script>
  </body>
</html>
